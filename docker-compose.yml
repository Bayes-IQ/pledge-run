version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pledgerun
      POSTGRES_PASSWORD: pledgerun
      POSTGRES_DB: pledgerun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pledgerun"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
